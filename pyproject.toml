[project]
name = "chippy"
version = "0.1.0"
description = "Standalone GNOME app for Dreame robot vacuums"
requires-python = ">=3.13"
dependencies = [
    "python-miio==0.5.12",
    "micloud==0.6",
    "secretstorage>=3.3",
    "requests>=2.31",
]

[project.scripts]
chippy = "chippy.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chippy"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv]
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning:miio", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
